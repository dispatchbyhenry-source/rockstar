{% extends 'base.html' %}
{% block title %}Admin Login | AR Shopping World{% endblock %}
{% block content %}
<main class="max-w-md mx-auto px-4 py-14 w-full">
  <form method="post" class="bg-white border border-red-100 rounded-3xl p-7 shadow-sm space-y-4">
    {{ csrf_field() }}
    <div class="text-center">
      <span class="bg-red-600 text-white px-3 py-2 rounded-xl font-black">AR</span>
      <h1 class="text-2xl font-black mt-4">Admin sign in</h1>
      <p class="text-sm text-slate-500 mt-1">Manage products, orders and store content.</p>
    </div>
    <input required name="username" autocomplete="username" placeholder="Username" class="w-full border rounded-xl p-3 text-sm">
    <input required type="password" name="password" autocomplete="current-password" placeholder="Password" class="w-full border rounded-xl p-3 text-sm">
    <button class="w-full bg-red-600 text-white font-bold py-3 rounded-xl">Sign in</button>
    <a href="{{ url_for('admin_forgot_password') }}" class="block text-center text-sm text-red-600 font-bold">Forgot password</a>
  </form>
</main>
{% endblock %}
