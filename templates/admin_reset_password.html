{% extends 'base.html' %}
{% block title %}Set New Admin Password | AR Shopping World{% endblock %}
{% block content %}
<main class="max-w-md mx-auto px-4 py-14 w-full">
  <form method="post" class="bg-white border border-red-100 rounded-3xl p-7 shadow-sm space-y-4">
    <div class="text-center">
      <span class="bg-red-600 text-white px-3 py-2 rounded-xl font-black">AR</span>
      <h1 class="text-2xl font-black mt-4">Set a new admin password</h1>
    </div>
    {{ csrf_field() }}
    <input required type="password" name="password" minlength="10" autocomplete="new-password" placeholder="New password (10+ characters)" class="w-full border rounded-xl p-3 text-sm">
    <input required type="password" name="confirm_password" minlength="10" autocomplete="new-password" placeholder="Confirm new password" class="w-full border rounded-xl p-3 text-sm">
    <button class="w-full bg-red-600 text-white font-bold py-3 rounded-xl">Update password</button>
  </form>
</main>
{% endblock %}
