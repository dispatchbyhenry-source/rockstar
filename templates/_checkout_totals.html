<aside class="lg:col-span-2 bg-red-950 text-white rounded-2xl p-6 h-fit">
  <h2 class="font-black">{{ t('order_summary') }}</h2>
  <div class="mt-4 space-y-3 text-sm">
    <div class="flex justify-between"><span>{{ t('subtotal') }}</span><span class="price" data-pkr="{{ total }}"></span></div>
    <div class="flex justify-between"><span>{{ t('tax_line', n=tax_percent) }}</span><span id="taxAmount" class="price" data-pkr="{{ tax }}"></span></div>
    <p class="text-xs text-red-200">{{ t('tax_on_both', n=tax_percent) }}</p>
    <div class="flex justify-between"><span>{{ t('weight') }}</span><span>{{ '%.2f'|format(cart_weight) }} kg</span></div>
    <div class="flex justify-between"><span>{{ t('delivery') }}</span><span id="shippingAmount" class="price" data-pkr="{{ shipping }}"></span></div>
    <p id="shippingMessage" class="text-xs text-red-200">{{ shipping_label }}</p>
    <div class="border-t border-red-800 pt-3 flex justify-between text-base font-black">
      <span>{{ t('total') }}</span><span id="grandAmount" class="price" data-pkr="{{ grand_total }}"></span>
    </div>
  </div>
  <p class="mt-5 text-[11px] text-red-200">{{ t('band_over') if heavy_order else t('band_under') }}</p>
</aside>
