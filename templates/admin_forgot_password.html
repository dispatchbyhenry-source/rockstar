{% extends 'base.html' %}
{% block title %}Reset Admin Password | AR Shopping World{% endblock %}
{% block content %}
<main class="max-w-md mx-auto px-4 py-14 w-full">
  <form method="post" class="bg-white border border-red-100 rounded-3xl p-7 shadow-sm space-y-4">
    <div class="text-center">
      <span class="bg-red-600 text-white px-3 py-2 rounded-xl font-black">AR</span>
      <h1 class="text-2xl font-black mt-4">Forgot admin password</h1>
      <p class="text-sm text-slate-500 mt-1">A reset link will be sent to the admin email saved in Settings.</p>
    </div>
    {{ csrf_field() }}
    <input required name="username" autocomplete="username" placeholder="Admin username" class="w-full border rounded-xl p-3 text-sm">
    <button class="w-full bg-red-600 text-white font-bold py-3 rounded-xl">Send reset email</button>
    <a href="{{ url_for('admin_login') }}" class="block text-center text-sm text-red-600 font-bold">Back to sign in</a>
  </form>
</main>
{% endblock %}
